<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Recipe Asset Manager</title>
    <style>
        :root { --primary: #ff6b6b; --bg: #f8f9fa; --card-bg: #ffffff; --text: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-section { background: var(--card-bg); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        .form-control { width: 100%; padding: 0.75rem; margin-top: 0.5rem; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-size: 1rem; cursor: pointer; width: 100%; transition: background 0.2s; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="login-section">
        <h2 style="margin-top: 0; text-align: center;">Login</h2>
        {% if form.errors %}
            <p style="color: red; text-align: center;">Your username and password didn't match. Please try again.</p>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div>
                <label for="id_username">Username:</label>
                <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" class="form-control">
            </div>
            <div>
                <label for="id_password">Password:</label>
                <input type="password" name="password" autocomplete="current-password" required id="id_password" class="form-control">
            </div>
            <button type="submit" class="btn-submit">Login</button>
            <input type="hidden" name="next" value="{{ next|default:'/' }}">
        </form>
        <a href="{% url 'gallery_home' %}" style="display: block; text-align: center; margin-top: 1.5rem; color: #999; text-decoration: none;">
            &larr; Back to Gallery
        </a>
    </div>
</body>
</html>
